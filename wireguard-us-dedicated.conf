[Interface]
Address = 10.0.0.102/32
ListenPort = 51821
PrivateKey = YOUR_US_PRIVATE_KEY_HERE
DNS = 8.8.8.8, 1.1.1.1, 208.67.222.222
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
Table = auto
MTU = 1420
SaveConfig = false

[Peer]
# US-Server-1-Primary
PublicKey = US_SERVER_1_PUBLIC_KEY
AllowedIPs = 10.0.0.101/32, 0.0.0.0/0
Endpoint = us-server-1.example.com:51820
PersistentKeepalive = 15

[Peer]
# US-Server-2-Backup
PublicKey = US_SERVER_2_PUBLIC_KEY
AllowedIPs = 10.0.0.103/32
Endpoint = us-server-2.example.com:51820
PersistentKeepalive = 15
