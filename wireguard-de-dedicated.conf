[Interface]
Address = 10.0.0.202/32
ListenPort = 51822
PrivateKey = YOUR_DE_PRIVATE_KEY_HERE
DNS = 8.8.8.8, 1.1.1.1, 208.67.222.222
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
Table = auto
MTU = 1420
SaveConfig = false

[Peer]
# DE-Server-1-Primary
PublicKey = DE_SERVER_1_PUBLIC_KEY
AllowedIPs = 10.0.0.201/32, 0.0.0.0/0
Endpoint = de-server-1.example.com:51820
PersistentKeepalive = 15

[Peer]
# DE-Server-2-Backup
PublicKey = DE_SERVER_2_PUBLIC_KEY
AllowedIPs = 10.0.0.203/32
Endpoint = de-server-2.example.com:51820
PersistentKeepalive = 15
