[Interface]
Address = 10.0.0.2/32
ListenPort = 51820
PrivateKey = YOUR_PRIVATE_KEY_HERE
DNS = 8.8.8.8, 1.1.1.1, 208.67.222.222, 9.9.9.9
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
Table = auto
MTU = 1420
SaveConfig = false

[Peer]
# US-Server-1-Primary-HighSpeed
PublicKey = US_SERVER_1_PUBLIC_KEY
AllowedIPs = 10.0.0.1/32
Endpoint = us-server-1.example.com:51820
PersistentKeepalive = 15

[Peer]
# US-Server-2-Backup-Stable
PublicKey = US_SERVER_2_PUBLIC_KEY
AllowedIPs = 10.0.0.3/32
Endpoint = us-server-2.example.com:51820
PersistentKeepalive = 15

[Peer]
# DE-Server-1-Primary-HighSpeed
PublicKey = DE_SERVER_1_PUBLIC_KEY
AllowedIPs = 10.0.0.5/32
Endpoint = de-server-1.example.com:51820
PersistentKeepalive = 15

[Peer]
# DE-Server-2-Backup-Stable
PublicKey = DE_SERVER_2_PUBLIC_KEY
AllowedIPs = 10.0.0.7/32
Endpoint = de-server-2.example.com:51820
PersistentKeepalive = 15
